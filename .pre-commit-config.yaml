# Pre-commit hooks for CraftNexus
# This file configures pre-commit hooks to run quality checks before commits

repos:
  # Rust code formatting check
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: bash -c 'cargo fmt --check'
        language: system
        types: [rust]
        pass_filenames: false
        always_run: false
        description: "Check Rust code formatting with cargo fmt"

  # ESLint for frontend files
  - repo: local
    hooks:
      - id: eslint
        name: eslint check
        entry: bash -c 'cd craft-nexus-forntend && npx eslint . --ext .ts,.tsx'
        language: system
        types: [typescript, typescriptreact]
        pass_filenames: false
        always_run: false
        description: "Check TypeScript/TSX files with ESLint"

  # General pre-commit checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key